<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f80ed">
  <meta name="format-detection" content="telephone=no">
  <title>เช็คชื่อชุมนุม</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="https://i.ibb.co/mVCtZ7mL/image.png" type="image/png">
  <link rel="apple-touch-icon" href="https://i.ibb.co/mVCtZ7mL/image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <img class="logo" src="https://i.ibb.co/mVCtZ7mL/image.png" alt="ตราโรงเรียน" width="52" height="52">
      <div class="brand"><h1>ระบบเช็คชื่อชุมนุม</h1><small id="school">กำลังโหลด…</small></div>
      <div class="top-acts">
        <button type="button" id="btnFont" title="ปรับขนาดตัวอักษร" aria-label="ปรับขนาดตัวอักษร">ก+</button>
        <a href="admin.html" title="ผู้ดูแลระบบ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span class="lbl">ผู้ดูแล</span></a>
      </div>
    </div>
  </header>
  <div class="demo-bar" id="demoBar" hidden>โหมดทดลอง: ข้อมูลจำลอง ไม่บันทึกลงชีตจริง (รหัสชุมนุมที่ 1 คือ 0122569)</div>

  <main class="wrap">
    <!-- หน้าแรก: เลือกชุมนุม -->
    <section id="viewClubs" class="stack">
      <div class="hello"><h2><span class="grad-text" id="helloText">สวัสดี คุณครู</span></h2><p id="helloSub">เลือกชุมนุมของท่าน แล้วใส่รหัสเพื่อเช็คชื่อ</p></div>
      <div class="card status" id="statusCard"><span class="dot"></span><div class="body"><b>กำลังตรวจสอบเวลา…</b></div></div>
      <div class="announce" id="announce" hidden></div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="input" id="search" type="search" placeholder="ค้นหาชุมนุม หรือชื่อครูที่ปรึกษา" autocomplete="off">
      </div>
      <div class="club-grid" id="clubGrid">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </section>

    <!-- หน้าเช็คชื่อ -->
    <section id="viewCheck" class="stack" hidden></section>
    <div class="foot">กิจกรรมพัฒนาผู้เรียน · ระบบเช็คชื่อชุมนุม</div>
  </main>

  <div class="bottom-bar" id="bottomBar" hidden>
    <div class="progress"><i id="progBar"></i></div>
    <div class="wrap">
      <button class="btn primary" id="btnReview"><span id="btnReviewText">ตรวจสอบและส่ง</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </div>

  <!-- ใส่รหัสชุมนุม -->
  <div class="modal" id="mCode" hidden>
    <form class="box stack" id="formCode" autocomplete="off">
      <div class="modal-head"><div class="mono" id="mCodeIc"></div><div style="flex:1;min-width:0"><h3 class="one-line" id="mCodeName"></h3><div class="muted small one-line" id="mCodeTc"></div></div></div>
      <div>
        <label class="f" for="codeInput">รหัสเข้าเช็คชื่อ</label>
        <input class="input code-input" id="codeInput" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="•••••••" required>
        <div class="muted small">รหัส 7 หลักที่ได้รับจากหัวหน้ากิจกรรมพัฒนาผู้เรียน</div>
      </div>
      <div class="err" id="codeErr"></div>
      <div class="row" style="flex-wrap:nowrap">
        <button type="button" class="btn ghost" data-close="#mCode">ยกเลิก</button>
        <button type="submit" class="btn primary" style="flex:1" id="btnLogin">เข้าสู่หน้าเช็คชื่อ</button>
      </div>
    </form>
  </div>

  <!-- ตรวจสอบก่อนส่ง -->
  <div class="modal" id="mConfirm" hidden>
    <form class="box stack" id="formConfirm" autocomplete="off">
      <div>
        <h3>ตรวจสอบก่อนส่ง</h3>
        <div class="muted small" id="cfWhere"></div>
      </div>
      <div class="sum-grid" id="cfSum"></div>
      <div id="cfNames"></div>
      <div>
        <label class="f" for="cfBy">ผู้เช็คชื่อ</label>
        <input class="input" id="cfBy" placeholder="เช่น อ.รุ่งทิวา หรือ หัวหน้าชุมนุม" required maxlength="60">
      </div>
      <div>
        <label class="f" for="cfCode">ยืนยันสิทธิ์: ใส่รหัสชุมนุมอีกครั้ง</label>
        <input class="input code-input" id="cfCode" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="•••••••" required>
      </div>
      <div class="muted small" id="cfRights"></div>
      <div class="err" id="cfErr"></div>
      <div class="row" style="flex-wrap:nowrap">
        <button type="button" class="btn ghost" data-close="#mConfirm">กลับไปแก้</button>
        <button type="submit" class="btn primary" style="flex:1" id="btnSend">ยืนยันและส่ง</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" hidden></canvas>

  <script src="config.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/mock.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
